<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRORIGINAL | Real ACS Asset Hub</title>
    <style>
        :root {
            --bg-dark: #0b0f12;
            --panel-bg: #12181d;
            --acs-blue: #0088ff;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --border-color: #1e293b;
            --success-green: #00cc66;
            --alert-red: #ff3333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- NAVBAR --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo {
            color: var(--acs-blue);
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            text-shadow: 0 0 10px rgba(0, 136, 255, 0.3);
        }

        .search-container {
            position: relative;
            flex-grow: 1;
            max-width: 500px;
        }

        .search-bar {
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 15px;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--acs-blue);
        }

        .section-title {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            color: var(--text-main);
            border-left: 3px solid var(--acs-blue);
            padding-left: 10px;
        }

        /* --- PRODUCTS --- */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .product-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-img-container {
            position: relative;
            width: 100%;
            height: 200px;
            background-color: #1a232c;
        }

        .product-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-details {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-title {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .product-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .product-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            color: var(--acs-blue);
            font-weight: bold;
            font-size: 1.1rem;
        }

        .buy-btn {
            background-color: var(--success-green);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: background 0.2s;
        }

        .buy-btn:hover {
            background-color: #00b359;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- NAVBAR -->
        <nav>
            <a href="#" class="logo">BRORIGINAL</a>
            <div class="search-container">
                <input type="text" class="search-bar" id="searchBar" onkeyup="filterAssets()" placeholder="Αναζήτηση συστημάτων...">
            </div>
        </nav>

        <!-- PRODUCTS SECTION -->
        <h2 class="section-title">Διαθέσιμα Συστήματα (ACS)</h2>
        <div class="products-grid" id="productsGrid">
            
            <!-- PRODUCT 1 -->
            <div class="product-card">
                <div class="product-img-container">
                    <!-- Replace this URL with your actual proof screenshot uploaded to GitHub -->
                    <img src="heavy-rifle-proof.png" alt="Custom ACS Heavy Rifle Config Visual Proof" onerror="this.src='https://images.unsplash.com/photo-1614680376593-902f74fa0d41?w=500'">
                </div>
                <div class="product-details">
                    <div>
                        <h3 class="product-title">Custom ACS Heavy Rifle Config</h3>
                        <p class="product-desc">Σύστημα ρεαλιστικής ανάκρουσης, custom UI και εξελιγμένο σύστημα σκόπευσης. Περιλαμβάνει προστασία whitelist.</p>
                    </div>
                    <div class="product-meta">
                        <span class="price">10.00 €</span>
                        <!-- Replace the href string below with your real Stripe Payment Link -->
                        <a href="https://buy.stripe.com/test_your_actual_link_here" target="_blank" class="buy-btn">Αγορά μέσω Stripe</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function filterAssets() {
            const input = document.getElementById('searchBar').value.toLowerCase();
            const cards = document.getElementsByClassName('product-card');
            for (let i = 0; i < cards.length; i++) {
                const title = cards[i].querySelector('.product-title').innerText.toLowerCase();
                if (title.includes(input)) cards[i].style.display = "flex";
                else cards[i].style.display = "none";
            }
        }
    </script>
</body>
</html>
