<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broriginal | Advanced Combat System Assets</title>
    <style>
        :root {
            --bg-dark: #0b0f12;
            --panel-bg: #12181d;
            --acs-blue: #0088ff;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --border-color: #1e293b;
            --success-green: #00cc66;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- NAVBAR --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo {
            color: var(--acs-blue);
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            text-shadow: 0 0 10px rgba(0, 136, 255, 0.3);
        }

        .search-container {
            position: relative;
            flex-grow: 1;
            max-width: 500px;
        }

        .search-bar {
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 15px;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--acs-blue);
        }

        .section-title {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            color: var(--text-main);
            border-left: 3px solid var(--acs-blue);
            padding-left: 10px;
        }

        /* --- LAYOUT COLUMNS --- */
        .shop-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .shop-layout {
                grid-template-columns: 1fr;
            }
        }

        /* --- PRODUCTS --- */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-img-container {
            position: relative;
            width: 100%;
            height: 180px;
            background-color: #1a232c;
        }

        .product-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-details {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-title {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .product-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .product-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            color: var(--acs-blue);
            font-weight: bold;
            font-size: 1.1rem;
        }

        .select-btn {
            background-color: var(--acs-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .select-btn:hover {
            background-color: #0066cc;
        }

        /* --- CHECKOUT FORM --- */
        .checkout-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            height: fit-content;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .form-group input {
            width: 100%;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--acs-blue);
        }

        .checkout-btn {
            width: 100%;
            background-color: var(--success-green);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .checkout-btn:hover {
            background-color: #00b359;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- NAVBAR -->
        <nav>
            <a href="#" class="logo">Broriginal</a>
            <div class="search-container">
                <input type="text" class="search-bar" id="searchBar" onkeyup="filterAssets()" placeholder="Αναζήτηση συστημάτων...">
            </div>
        </nav>

        <div class="shop-layout">
            <!-- LEFT COLUMN: PRODUCTS -->
            <div>
                <h2 class="section-title">Διαθέσιμα Συστήματα (ACS)</h2>
                <div class="products-grid" id="productsGrid">
                    
                    <div class="product-card">
                        <div class="product-img-container">
                            <img src="heavy-rifle-proof.png" alt="Custom ACS Heavy Rifle Config Visual Proof" onerror="this.src='https://images.unsplash.com/photo-1614680376593-902f74fa0d41?w=500'">
                        </div>
                        <div class="product-details">
                            <div>
                                <h3 class="product-title">Custom ACS Heavy Rifle Config</h3>
                                <p class="product-desc">Σύστημα ρεαλιστικής ανάκρουσης, custom UI και εξελιγμένο σύστημα σκόπευσης.</p>
                            </div>
                            <div class="product-meta">
                                <span class="price">10.00 €</span>
                                <button class="select-btn" onclick="selectItem('Custom ACS Heavy Rifle Config')">Επιλογή</button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- RIGHT COLUMN: BILLING FORM -->
            <div>
                <h2 class="section-title">Στοιχεία Αγοράς</h2>
                <div class="checkout-panel">
                    <form id="purchaseForm" onsubmit="handleCheckout(event)">
                        <div class="form-group">
                            <label for="assetName">Επιλεγμένο Προϊόν</label>
                            <input type="text" id="assetName" readonly placeholder="Πατήστε Επιλογή σε ένα προϊόν">
                        </div>
                        <div class="form-group">
                            <label for="firstName">Όνομα</label>
                            <input type="text" id="firstName" required placeholder="Εισάγετε το όνομά σας">
                        </div>
                        <div class="form-group">
                            <label for="lastName">Επίθετο</label>
                            <input type="text" id="lastName" required placeholder="Εισάγετε το επίθετό σας">
                        </div>
                        <div class="form-group">
                            <label for="address">Διεύθυνση Αποστολής / Κατοικίας</label>
                            <input type="text" id="address" required placeholder="Οδός, Αριθμός, Πόλη, Τ.Κ.">
                        </div>
                        <button type="submit" class="checkout-btn">Επιβεβαίωση Αγοράς</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function selectItem(name) {
            document.getElementById('assetName').value = name;
        }

        function handleCheckout(e) {
            e.preventDefault();
            const asset = document.getElementById('assetName').value;
            if(!asset) {
                alert('Παρακαλώ επιλέξτε ένα προϊόν πρώτα!');
                return;
            }
            alert('Η παραγγελία σας για το "' + asset + '" καταχωρήθηκε επιτυχώς!');
        }

        function filterAssets() {
            const input = document.getElementById('searchBar').value.toLowerCase();
            const cards = document.getElementsByClassName('product-card');
            for (let i = 0; i < cards.length; i++) {
                const title = cards[i].querySelector('.product-title').innerText.toLowerCase();
                if (title.includes(input)) cards[i].style.display = "flex";
                else cards[i].style.display = "none";
            }
        }
    </script>
</body>
</html>
